# Visits the deployed apps every 6 hours with a real browser so Streamlit
# Community Cloud (which sleeps apps after ~12 hours without a visitor) keeps
# them running, and wakes them if they have already gone to sleep.
# adapt2026: the main app. adapt-beta: the test copy (app_beta.py).
name: Keep the apps awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        url:
          - https://adapt2026.streamlit.app/
          - https://adapt-beta.streamlit.app/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Visit the app
        run: python tools/keep_awake.py "${{ matrix.url }}"
